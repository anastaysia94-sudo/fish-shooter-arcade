name: Build PartyTeller Work Log APK

on:
  push:
    branches:
      - party-teller-worklog-apk
    paths:
      - '.github/workflows/party-teller-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recreate Android project
        shell: bash
        run: |
          mkdir -p party-teller-worklog
          echo '' | base64 -d > /tmp/party_teller_src.tgz
          tar -xzf /tmp/party_teller_src.tgz -C party-teller-worklog
          find party-teller-worklog -maxdepth 4 -type f | sort

      - name: Build installable debug APK
        shell: bash
        run: |
          gradle -p party-teller-worklog --no-daemon :app:assembleDebug
          cp party-teller-worklog/app/build/outputs/apk/debug/app-debug.apk PartyTeller-WorkLog.apk
          ls -lh PartyTeller-WorkLog.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PartyTeller-WorkLog-APK
          path: PartyTeller-WorkLog.apk
          if-no-files-found: error
          retention-days: 30
