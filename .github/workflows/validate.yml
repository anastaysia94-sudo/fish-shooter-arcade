name: Validate F.S.A. Release

on:
  push:
    branches: [main, closure-started-scope-20260908]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate cinematic arcade v9 closure and Founder Console
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f fsa-v8.css
          test -f gameplay-layout-v9.css
          test -f fsa-v9.js
          test -f gameplay-selftest.js
          test -f manifest.webmanifest
          test -f sw.js
          test -f assets/fsa-mark.svg
          test -f assets/fsa-boss-event.svg
          test -f assets/fsa-gameplay.svg
          test -f assets/fsa-lobby.svg
          test -f admin/index.html
          test -f admin/styles.css
          test -f admin/app.js
          test -f admin/logic-selftest.js
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          manifest=json.loads((root/'manifest.webmanifest').read_text())
          html=(root/'index.html').read_text()
          js=(root/'fsa-v9.js').read_text()
          css=(root/'fsa-v8.css').read_text()+'\n'+(root/'gameplay-layout-v9.css').read_text()
          sw=(root/'sw.js').read_text()
          admin=(root/'admin/app.js').read_text()
          admin_html=(root/'admin/index.html').read_text()
          assert manifest['name'].startswith('F.S.A.')
          assert manifest['display']=='standalone'
          for phrase in ['FISH SHOOTER ARCADE','Fish Shooter Alliance','OCEAN LEGENDS','MEGA JACKPOT','OCEAN FEVER','DAILY MISSIONS','ROOM SELECTION','BOSS HUNT','LIVE REWARDS']:
              assert phrase in html, phrase
          fish_titles=['Reef Run','Dragon Depths',"Pirate's Plunder",'Atlantis Rising','Ice Tide','Lava Reef','Storm Seas','Jade Dragon','Neon Ocean','Ancient Ruins','Mecha Marine','Coral Chaos',"Kraken's Lair",'Treasure Trials','Boss Rush']
          slot_titles=['Ocean Fortune','Treasure Reels',"Siren's Gold",'Legend of Atlantis','Shark Jackpot','Pearl Rush','Kraken Spins','Reef Riches','Lucky Tide','Deep Diamonds','Golden Anchor',"Mermaid's Treasure",'Pirate Jackpot','Coral Cash',"Neptune's Wheel",'Sea King 777','Ocean Wilds','Diamond Dolphin','Wild Pearls','Treasure Temple']
          assert all(x in js for x in fish_titles)
          assert all(x in js for x in slot_titles)
          for phrase in ['Pulse Cannon','Spread Blaster','Rail Harpoon','Bronze Reef','Silver Current','Gold Abyss','navigator.connection','saveData','slow-','2g','OCEAN FEVER','LIGHTNING CHAIN','DEEP FREEZE','DEPTH BOMB','AUTO FIRE','LOCK ON']:
              assert phrase in js or phrase in html, phrase
          for phrase in ['v8-game','boss-hud','oceanradar','weapon-switch','seatgun','slot-modal']:
              assert phrase in css or phrase in html.lower().replace(' ',''), phrase
          assert 'lifeBar:!!t.hard' in js
          assert 'if(f.boss||f.lifeBar)' in js
          assert 'hpMult:9.5' in js
          assert 'ROOM_BETS' in js
          assert 'autoLimit=bet()*50' in js
          assert 'opacity:.22' in css and 'opacity:1!important' in css
          assert '.seatgun:nth-child(4){left:50%;top:8px' in css
          safety=html.lower()
          assert 'virtual/non-cash' in safety and 'no cash redemption' in safety
          for phrase in ['fsa-v8.css','gameplay-layout-v9.css','fsa-v9.js']:
              assert phrase in html or phrase in sw, phrase
          assert 'gameplay-layout-v9.css' in html and 'gameplay-layout-v9.css' in sw
          assert 'fsa-v9.js' in html and 'fsa-v9.js' in sw
          assert "const fallback=isAdmin?'./admin/index.html':'./index.html'" in sw
          for phrase in ['creditLimit','cashier','moderator','reverseEntry','audit','Bulk create','scopedUsers','Agent credit ceiling exceeded','reversedBy']:
              assert phrase in admin or phrase in admin_html, phrase
          assert 'actorAgent' in admin_html
          print('FSA_V9_VISUAL_SHELL=PASS')
          print('CATALOG=PASS fish=15 slots=20')
          print('GAMEPLAY=PASS guns=3 rooms=3 bosses=1 missions=4 radar=1 fever=1 powers=4 rivals=4 hard_target_lifebars=1 auto_guard=1')
          print('LANDSCAPE_HUD=PASS player_boxes=0 floating_guns=4 current_opaque=1 rivals_translucent=1 p4_top_station=1')
          print('LOW_DATA=PASS network_api=1 saveData=1 2g=1 constrained_device=1 reduced_motion=1 offline_shell=1')
          print('FOUNDER_CONSOLE_BROWSER_CLOSURE=PASS role_scope=1 cashier_separation=1 ceilings=1 reversals=1 inheritance=1')
          PY
          node --check fsa-v9.js
          node --check gameplay-selftest.js
          node --check admin/app.js
          node --check admin/logic-selftest.js
          node --check sw.js
          node gameplay-selftest.js
          node admin/logic-selftest.js
          echo 'JS_AND_LOGIC_TESTS=PASS'
