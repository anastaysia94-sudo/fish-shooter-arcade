name: Validate F.S.A. Release

on:
  push:
    branches: [main, fsa-distributor-hierarchy-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate arcade and production hierarchy
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html fsa-v8.css gameplay-layout-v9.css fsa-v9.js gameplay-selftest.js manifest.webmanifest sw.js admin/index.html admin/styles.css admin/app.js admin/logic-selftest.js backend/supabase/migrations/20260908_fsa_founder_console_backend_v1.sql backend/supabase/migrations/20260909_fsa_distributor_hierarchy_schema_v2.sql backend/supabase/migrations/20260909_fsa_distributor_hierarchy_authority_v2.sql backend/supabase/functions/fsa-founder-admin/index.ts; do test -f "$f"; done
          python3 - <<'PY'
          import json,pathlib
          r=pathlib.Path('.')
          manifest=json.loads((r/'manifest.webmanifest').read_text())
          html=(r/'index.html').read_text(); js=(r/'fsa-v9.js').read_text(); css=(r/'fsa-v8.css').read_text()+'\n'+(r/'gameplay-layout-v9.css').read_text(); sw=(r/'sw.js').read_text()
          admin=(r/'admin/app.js').read_text(); ah=(r/'admin/index.html').read_text(); schema=(r/'backend/supabase/migrations/20260909_fsa_distributor_hierarchy_schema_v2.sql').read_text(); auth=(r/'backend/supabase/migrations/20260909_fsa_distributor_hierarchy_authority_v2.sql').read_text(); edge=(r/'backend/supabase/functions/fsa-founder-admin/index.ts').read_text()
          assert manifest['name'].startswith('F.S.A.') and manifest['display']=='standalone'
          fish=['Reef Run','Dragon Depths',"Pirate's Plunder",'Atlantis Rising','Ice Tide','Lava Reef','Storm Seas','Jade Dragon','Neon Ocean','Ancient Ruins','Mecha Marine','Coral Chaos',"Kraken's Lair",'Treasure Trials','Boss Rush']
          slots=['Ocean Fortune','Treasure Reels',"Siren's Gold",'Legend of Atlantis','Shark Jackpot','Pearl Rush','Kraken Spins','Reef Riches','Lucky Tide','Deep Diamonds','Golden Anchor',"Mermaid's Treasure",'Pirate Jackpot','Coral Cash',"Neptune's Wheel",'Sea King 777','Ocean Wilds','Diamond Dolphin','Wild Pearls','Treasure Temple']
          assert all(x in js for x in fish) and all(x in js for x in slots)
          for p in ['Pulse Cannon','Spread Blaster','Rail Harpoon','Bronze Reef','Silver Current','Gold Abyss','saveData','2g','OCEAN FEVER','AUTO FIRE','LOCK ON']: assert p in js or p in html,p
          assert 'lifeBar:!!t.hard' in js and 'if(f.boss||f.lifeBar)' in js and 'hpMult:9.5' in js
          assert 'virtual/non-cash' in html.lower() and 'no cash redemption' in html.lower()
          for p in ['Founder → Distributor → Agent → User','Distributors','Distributor credit ceiling','Agent credit ceiling','localStorage is not authority']: assert p in ah,p
          for p in ['fsa_distributors','fsa_distributor_game_access','invite_distributor','invite_agent','fsa_rpc_update_distributor','fsa_rpc_reassign_agent','fsa_rpc_set_distributor_games']: assert p in admin or p in edge,p
          for p in ['public.fsa_distributors','distributor_id uuid','can_manage_agents','can_manage_users','schema_version=2']: assert p in schema,p
          for p in ['assert_operator_v2','session_distributor_id','FSA_DISTRIBUTOR_CREDIT_CEILING_EXCEEDED','FSA_AGENT_CREDIT_CEILING_EXCEEDED','fsa_rpc_update_distributor','fsa_rpc_reassign_agent','fsa_rpc_set_distributor_games','fsa_distributors_scope_read']: assert p in auth,p
          assert 'localStorage.setItem(' not in admin and 'SUPABASE_SERVICE_ROLE_KEY' not in admin
          assert "Deno.env.get('SUPABASE_SERVICE_ROLE_KEY')" in edge and "jwtPayload(token).aal !== 'aal2'" in edge
          assert 'fsa-arcade-v11-distributor-hierarchy-20260909' in sw
          assert "/\\/admin\\/(?:app\\.js|styles\\.css|index\\.html)$/" in sw
          print('CATALOG=PASS fish=15 slots=20')
          print('GAMEPLAY=PASS hard_target_lifebars=1 guns=3 rooms=3 low_data=1')
          print('HIERARCHY=PASS founder=1 distributor=1 agent=1 user=1 rls=1 mfa=1 dual_ceiling=1 game_inheritance=1')
          PY
          node --check fsa-v9.js
          node --check gameplay-selftest.js
          node --input-type=module --check < admin/app.js
          node --check admin/logic-selftest.js
          node --check sw.js
          node gameplay-selftest.js
          node admin/logic-selftest.js
          echo 'FSA_RELEASE_HIERARCHY_V2=PASS'
