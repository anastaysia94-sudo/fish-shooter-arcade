name: Validate F.S.A. Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate premium arcade and Founder Console
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f premium-ui-v4.css
          test -f app.js
          test -f premium-engine-v4.js
          test -f manifest.webmanifest
          test -f sw.js
          test -f assets/fsa-mark.svg
          test -f assets/captain-reef.jpg
          test -f admin/index.html
          test -f admin/styles.css
          test -f admin/app.js
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          manifest=json.loads((root/'manifest.webmanifest').read_text())
          assert manifest['name'].startswith('F.S.A.')
          assert manifest['display']=='standalone'
          html=(root/'index.html').read_text()
          legacy=(root/'app.js').read_text()
          premium=(root/'premium-engine-v4.js').read_text()
          premium_css=(root/'premium-ui-v4.css').read_text()
          sw=(root/'sw.js').read_text()
          admin=(root/'admin/app.js').read_text()
          admin_html=(root/'admin/index.html').read_text()

          for phrase in ['Reef Run','Fish Shooter Games · 15','Slot Games · 20']:
              assert phrase in html or phrase in legacy or phrase in premium, phrase

          safety=(html+'\n'+legacy+'\n'+premium).lower()
          assert 'virtual/non-cash' in safety

          fish_titles=['Reef Run','Dragon Depths',"Pirate's Plunder",'Atlantis Rising','Ice Tide','Lava Reef','Storm Seas','Jade Dragon','Neon Ocean','Ancient Ruins','Mecha Marine','Coral Chaos',"Kraken's Lair",'Treasure Trials','Boss Rush']
          slot_titles=['Ocean Fortune','Treasure Reels',"Siren's Gold",'Legend of Atlantis','Shark Jackpot','Pearl Rush','Kraken Spins','Reef Riches','Lucky Tide','Deep Diamonds','Golden Anchor',"Mermaid's Treasure",'Pirate Jackpot','Coral Cash',"Neptune's Wheel",'Sea King 777','Ocean Wilds','Diamond Dolphin','Wild Pearls','Treasure Temple']
          assert all(x in premium for x in fish_titles)
          assert all(x in legacy for x in slot_titles)

          for phrase in ['fsa.telemetry.v5','Bronze Reef','Silver Current','Gold Abyss','FEVER MODE','Ocean Radar','auto_fire','lock_on','species_filter','freeze','lightning','bomb','net','navigator.connection','saveData','effectiveType','2g','shot_fired','school_spawned','Laser Shrimp','Rocket Shrimp','Twin Dragon']:
              assert phrase in premium or phrase in premium_css, phrase

          for phrase in ['premium-ui-v4.css','premium-engine-v4.js']:
              assert phrase in html, phrase
              assert phrase in sw, phrase

          for phrase in ['creditLimit','cashier','moderator','reverseLedger','audit','Bulk create']:
              assert phrase in admin or phrase in admin_html, phrase

          print('CATALOG_VALIDATION=PASS fish=15 slots=20')
          print('FISH_TABLE_ENGINE=PASS telemetry=v5 rooms=3 projectiles=1 schools=1 special_targets=1 bosses=1 powers=4 fever=1 radar=1')
          print('LOW_DATA_VALIDATION=PASS adaptive_network=1 saveData=1 2g=1 cache_filename_compatible=1')
          print('FOUNDER_CONSOLE_VALIDATION=PASS')
          PY
          node --check app.js
          node --check premium-engine-v4.js
          node --check admin/app.js
          node --check sw.js
          echo 'JS_SYNTAX=PASS'