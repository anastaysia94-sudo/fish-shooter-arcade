name: Deploy F.S.A. to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate Dense Graphics V15 before browser QA
        run: |
          node --check dense-graphics-v15.js
          node --check tests/dense-graphics-v15-contract.mjs
          node tests/dense-graphics-v15-contract.mjs
      - name: Install visual QA browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in {1..30}; do
            if curl -fsS --max-time 15 "$PAGE_URL" >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify Visual QA Experience route
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          QA_URL="${PAGE_URL%/}/qa/"
          EVIDENCE_URL="${PAGE_URL%/}/qa/evidence/10-five-reel-jackpot.jpg"
          for i in {1..30}; do
            BODY="$(curl -fsS --max-time 15 "$QA_URL" || true)"
            if grep -q 'VISUAL QA EXPERIENCE' <<<"$BODY" \
              && grep -q '12/12 CERTIFIED' <<<"$BODY" \
              && curl -fsS --max-time 15 -o /dev/null "$EVIDENCE_URL"; then
              echo "FSA_VISUAL_QA_ROUTE=PASS url=$QA_URL"
              exit 0
            fi
            sleep 2
          done
          echo "Visual QA Experience route did not become verifiable in time" >&2
          exit 1
      - name: Warm critical live runtime assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          ROOT="${PAGE_URL%/}"
          assets=(
            "/"
            "/index.html"
            "/fsa-v9.js"
            "/fsa-v8.css"
            "/gameplay-layout-v9.css"
            "/visual-fidelity-v10.css"
            "/arcade-intensity-v12.css"
            "/boss-spectacle-v13.css"
            "/dense-mode-v14.css"
            "/dense-mode-v14-overlay.css"
            "/dense-graphics-v15.css"
            "/arcade-intensity-v12.js"
            "/boss-spectacle-v13.js"
            "/dense-mode-v14.js"
            "/dense-graphics-v15.js"
            "/telemetry-v1.js"
          )
          for asset in "${assets[@]}"; do
            echo "Preflighting $asset"
            curl --retry 5 --retry-all-errors --retry-delay 2 -fsS --max-time 30 -o /dev/null "$ROOT$asset"
          done
          echo "FSA_LIVE_RUNTIME_PREFLIGHT=PASS"
      - name: Verify deployed runtime byte parity
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          ROOT="${PAGE_URL%/}"
          files=(
            "index.html"
            "fsa-v9.js"
            "fsa-v8.css"
            "gameplay-layout-v9.css"
            "visual-fidelity-v10.css"
            "cloud-sync-v11.css"
            "cloud-sync-v11.js"
            "arcade-intensity-v12.css"
            "arcade-intensity-v12.js"
            "boss-spectacle-v13.css"
            "boss-spectacle-v13.js"
            "arcade-intensity-v12-bridge.js"
            "dense-mode-v14.css"
            "dense-mode-v14-overlay.css"
            "dense-mode-v14.js"
            "dense-graphics-v15.css"
            "dense-graphics-v15.js"
            "telemetry-v1.js"
            "sw.js"
            "assets/fsa-fish-hd-atlas.webp"
            "assets/fsa-slots-hd-atlas.webp"
            "assets/reef-run-hd-battle.webp"
            "assets/fsa-slot-atlas-v10.svg"
            "assets/fsa-title-atlas-v10.svg"
            "admin/index.html"
            "admin/styles.css"
            "admin/app.js"
          )
          rm -rf /tmp/fsa-live-parity
          mkdir -p /tmp/fsa-live-parity
          : > /tmp/fsa-parity-files.txt
          for file in "${files[@]}"; do
            remote="/tmp/fsa-live-parity/$file"
            mkdir -p "$(dirname "$remote")"
            curl --retry 5 --retry-all-errors --retry-delay 2 --compressed -fsS --max-time 30 "$ROOT/$file" -o "$remote"
            if ! cmp -s "$file" "$remote"; then
              echo "DEPLOYED BYTE PARITY FAILED: $file" >&2
              echo "checkout:" >&2
              sha256sum "$file" >&2
              echo "production:" >&2
              sha256sum "$remote" >&2
              exit 1
            fi
            printf '%s\n' "$file" >> /tmp/fsa-parity-files.txt
          done
          echo "FSA_DEPLOYED_BYTE_PARITY=PASS files=${#files[@]} source=$ROOT/"
      - name: Capture byte-verified visual acceptance set
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          export FSA_LIVE_SOURCE_URL="${PAGE_URL%/}/"

          # GitHub-hosted Chromium has repeatedly hung on ordinary network navigation,
          # including 127.0.0.1, while curl and production parity remain healthy.
          # Patch only the disposable CI harness so browser requests are fulfilled
          # in-process from this exact byte-verified checkout.
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/visual-acceptance-capture.mjs')
          text = path.read_text()
          text = text.replace(
              "import { mkdir, rm, writeFile } from 'node:fs/promises';",
              "import { mkdir, rm, writeFile, readFile } from 'node:fs/promises';"
          )
          text = text.replace(
              "import { resolve } from 'node:path';",
              "import { resolve, extname, sep } from 'node:path';"
          )
          text = text.replace(
              "const browser = await chromium.launch({headless:true});",
              "const fixtureRoot=resolve('.');\\nconst browser = await chromium.launch({headless:true,args:['--no-proxy-server']});"
          )

          old = """async function page(width,height,mobile=false,low=false){
            const c=await browser.newContext({viewport:{width,height},screen:{width,height},isMobile:mobile,hasTouch:mobile,userAgent:mobile?ua:undefined});
            if(low) await c.addInitScript(()=>{const v={saveData:true,effectiveType:'2g',downlink:.25,rtt:900,addEventListener(){},removeEventListener(){}};for(const k of ['connection','mozConnection','webkitConnection'])try{Object.defineProperty(navigator,k,{get:()=>v})}catch{};try{Object.defineProperty(navigator,'deviceMemory',{get:()=>2})}catch{};try{Object.defineProperty(navigator,'hardwareConcurrency',{get:()=>2})}catch{}});
            const p=await c.newPage();
            p.setDefaultTimeout(60000);
            p.on('pageerror',error=>console.error(`FSA_BROWSER_PAGEERROR ${error.message}`));
            p.on('requestfailed',request=>console.error(`FSA_BROWSER_REQUEST_FAILED ${request.method()} ${request.url()} ${request.failure()?.errorText||''}`));
            return {c,p};
          }"""

          new = """const MIME={'.html':'text/html; charset=utf-8','.css':'text/css; charset=utf-8','.js':'text/javascript; charset=utf-8','.mjs':'text/javascript; charset=utf-8','.json':'application/json; charset=utf-8','.webmanifest':'application/manifest+json; charset=utf-8','.svg':'image/svg+xml','.webp':'image/webp','.png':'image/png','.jpg':'image/jpeg','.jpeg':'image/jpeg'};
          async function page(width,height,mobile=false,low=false){
            const c=await browser.newContext({viewport:{width,height},screen:{width,height},isMobile:mobile,hasTouch:mobile,userAgent:mobile?ua:undefined,serviceWorkers:'block'});
            await c.route('**/*',async route=>{
              const request=route.request();
              let url;
              try{url=new URL(request.url())}catch{return route.abort('blockedbyclient')}
              if(url.origin!==base.origin)return route.abort('blockedbyclient');
              let rel=decodeURIComponent(url.pathname).replace(/^\\/+/, '');
              if(!rel||rel.endsWith('/'))rel+='index.html';
              const file=resolve(fixtureRoot,rel);
              if(file!==fixtureRoot&&!file.startsWith(fixtureRoot+sep))return route.fulfill({status:403,body:'forbidden'});
              try{
                const body=await readFile(file);
                return route.fulfill({status:200,body,contentType:MIME[extname(file).toLowerCase()]||'application/octet-stream',headers:{'Cache-Control':'no-store'}});
              }catch(error){
                if(error?.code==='ENOENT')return route.fulfill({status:404,body:'not found'});
                throw error;
              }
            });
            if(low) await c.addInitScript(()=>{const v={saveData:true,effectiveType:'2g',downlink:.25,rtt:900,addEventListener(){},removeEventListener(){}};for(const k of ['connection','mozConnection','webkitConnection'])try{Object.defineProperty(navigator,k,{get:()=>v})}catch{};try{Object.defineProperty(navigator,'deviceMemory',{get:()=>2})}catch{};try{Object.defineProperty(navigator,'hardwareConcurrency',{get:()=>2})}catch{}});
            const p=await c.newPage();
            p.setDefaultTimeout(60000);
            p.on('pageerror',error=>console.error(`FSA_BROWSER_PAGEERROR ${error.message}`));
            p.on('requestfailed',request=>{if(!/^https?:\\/\\/fsa\\.local\\//.test(request.url()))return;console.error(`FSA_BROWSER_REQUEST_FAILED ${request.method()} ${request.url()} ${request.failure()?.errorText||''}`)});
            return {c,p};
          }"""

          if old not in text:
              raise SystemExit('Expected visual harness page() block was not found; refusing a silent CI rewrite')
          text = text.replace(old, new)
          path.write_text(text)
          print('FSA_INPROCESS_FIXTURE_PATCH=PASS')
          PY

          node --check tests/visual-acceptance-capture.mjs

          if ! node tests/visual-acceptance-capture.mjs "http://fsa.local/"; then
            echo "First in-process capture attempt failed; retrying once." >&2
            sleep 2
            if ! node tests/visual-acceptance-capture.mjs "http://fsa.local/"; then
              mkdir -p artifacts/visual-acceptance
              python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          Path('artifacts/visual-acceptance/failure.json').write_text(json.dumps({
              'schema':'fsa.visual-acceptance.failure.v3',
              'sourceUrl':os.environ.get('FSA_LIVE_SOURCE_URL'),
              'sourceCommit':os.environ.get('GITHUB_SHA'),
              'generatedAt':datetime.now(timezone.utc).isoformat(),
              'message':'Production byte parity passed, but both in-process browser-render attempts failed.'
          },indent=2)+'\n')
          PY
              exit 1
            fi
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("artifacts/visual-acceptance/manifest.json")
          data = json.loads(path.read_text())
          parity_files = [line.strip() for line in Path("/tmp/fsa-parity-files.txt").read_text().splitlines() if line.strip()]
          data["baseUrl"] = os.environ["FSA_LIVE_SOURCE_URL"]
          data["sourceUrl"] = os.environ["FSA_LIVE_SOURCE_URL"]
          data["sourceCommit"] = os.environ.get("GITHUB_SHA")
          data["captureTransport"] = "Playwright in-process route fulfillment from the exact Pages deployment source after production byte-parity verification"
          data["deploymentParity"] = {
              "verified": True,
              "productionUrl": os.environ["FSA_LIVE_SOURCE_URL"],
              "verifiedFileCount": len(parity_files),
              "verifiedFiles": parity_files,
          }
          path.write_text(json.dumps(data, indent=2) + "\n")
          print("FSA_VISUAL_MANIFEST_SOURCE=PASS", data["sourceUrl"], data["sourceCommit"], "parityFiles=", len(parity_files))
          PY
      - name: Upload live visual acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsa-live-visual-acceptance-${{ github.sha }}
          path: artifacts/visual-acceptance/
          if-no-files-found: error
          retention-days: 30
