name: Deploy F.S.A. to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate visual runtime before browser QA
        run: |
          node --check dense-graphics-v15.js
          node --check tests/dense-graphics-v15-contract.mjs
          node tests/dense-graphics-v15-contract.mjs
      - name: Install visual QA browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in {1..30}; do
            if curl -fsS --max-time 15 "$PAGE_URL" >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify Visual QA Experience route
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          QA_URL="${PAGE_URL%/}/qa/"
          EVIDENCE_URL="${PAGE_URL%/}/qa/evidence/10-five-reel-jackpot.jpg"
          for i in {1..30}; do
            BODY="$(curl -fsS --max-time 15 "$QA_URL" || true)"
            if grep -q 'VISUAL QA EXPERIENCE' <<<"$BODY" \
              && grep -q '12/12 CERTIFIED' <<<"$BODY" \
              && curl -fsS --max-time 15 -o /dev/null "$EVIDENCE_URL"; then
              echo "FSA_VISUAL_QA_ROUTE=PASS url=$QA_URL"
              exit 0
            fi
            sleep 2
          done
          echo "Visual QA Experience route did not become verifiable in time" >&2
          exit 1
      - name: Warm critical live runtime assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          ROOT="${PAGE_URL%/}"
          assets=(
            "/"
            "/index.html"
            "/fsa-v9.js"
            "/fsa-v8.css"
            "/gameplay-layout-v9.css"
            "/visual-fidelity-v10.css"
            "/arcade-intensity-v12.css"
            "/boss-spectacle-v13.css"
            "/dense-mode-v14.css"
            "/dense-mode-v14-overlay.css"
            "/dense-graphics-v15.css"
            "/arcade-intensity-v12.js"
            "/boss-spectacle-v13.js"
            "/dense-mode-v14.js"
            "/dense-graphics-v15.js"
          )
          for asset in "${assets[@]}"; do
            echo "Preflighting $asset"
            curl --retry 5 --retry-all-errors --retry-delay 2 -fsS --max-time 30 -o /dev/null "$ROOT$asset"
          done
          echo "FSA_LIVE_RUNTIME_PREFLIGHT=PASS"
      - name: Capture live visual acceptance set
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          export FSA_LIVE_SOURCE_URL="${PAGE_URL%/}/"
          python3 - <<'PY' >/tmp/fsa-live-proxy.log 2>&1 &
          import os
          import urllib.request
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          target = os.environ["FSA_LIVE_SOURCE_URL"].rstrip("/") + "/"

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  url = target + self.path.lstrip("/")
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "FSA-Visual-QA-Proxy/1.1",
                          "Cache-Control": "no-cache",
                      },
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          body = response.read()
                          self.send_response(response.status)
                          for key, value in response.headers.items():
                              if key.lower() not in {"content-length", "transfer-encoding", "connection", "content-encoding"}:
                                  self.send_header(key, value)
                          self.send_header("Cache-Control", "no-store, max-age=0")
                          self.send_header("Content-Length", str(len(body)))
                          self.end_headers()
                          self.wfile.write(body)
                  except Exception as exc:
                      body = f"upstream fetch failed: {exc}".encode()
                      self.send_response(502)
                      self.send_header("Content-Type", "text/plain; charset=utf-8")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

              def log_message(self, fmt, *args):
                  print("FSA_LIVE_PROXY", fmt % args, flush=True)

          ThreadingHTTPServer(("127.0.0.1", 4173), Handler).serve_forever()
          PY
          PROXY_PID=$!
          trap 'kill "$PROXY_PID" 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl -fsS --max-time 15 http://127.0.0.1:4173/ >/dev/null; then
              echo "FSA_LIVE_PROXY=PASS source=$FSA_LIVE_SOURCE_URL"
              break
            fi
            sleep 1
          done
          curl -fsS --max-time 15 http://127.0.0.1:4173/ >/dev/null

          if ! node tests/visual-acceptance-capture.mjs "http://127.0.0.1:4173/"; then
            echo "First proxied live capture attempt failed; retrying once."
            sleep 5
            if ! node tests/visual-acceptance-capture.mjs "http://127.0.0.1:4173/"; then
              mkdir -p artifacts/visual-acceptance
              python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          Path('artifacts/visual-acceptance/failure.json').write_text(json.dumps({
              'schema':'fsa.visual-acceptance.failure.v1',
              'sourceUrl':os.environ.get('FSA_LIVE_SOURCE_URL'),
              'sourceCommit':os.environ.get('GITHUB_SHA'),
              'generatedAt':datetime.now(timezone.utc).isoformat(),
              'message':'Both canonical proxied visual-acceptance capture attempts failed. See workflow log and proxy log.'
          },indent=2)+'\n')
          PY
              echo "--- live proxy diagnostics ---" >&2
              tail -n 200 /tmp/fsa-live-proxy.log >&2 || true
              exit 1
            fi
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("artifacts/visual-acceptance/manifest.json")
          data = json.loads(path.read_text())
          data["baseUrl"] = os.environ["FSA_LIVE_SOURCE_URL"]
          data["sourceUrl"] = os.environ["FSA_LIVE_SOURCE_URL"]
          data["sourceCommit"] = os.environ.get("GITHUB_SHA")
          data["captureTransport"] = "same-origin reverse proxy streaming deployed GitHub Pages bytes"
          path.write_text(json.dumps(data, indent=2) + "\n")
          print("FSA_VISUAL_MANIFEST_SOURCE=PASS", data["sourceUrl"], data["sourceCommit"])
          PY
      - name: Upload live visual acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsa-live-visual-acceptance-${{ github.sha }}
          path: artifacts/visual-acceptance/
          if-no-files-found: error
          retention-days: 30
