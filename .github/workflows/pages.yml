name: Deploy F.S.A. to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate visual runtime before browser QA
        run: |
          node --check dense-graphics-v15.js
          node --check tests/dense-graphics-v15-contract.mjs
          node tests/dense-graphics-v15-contract.mjs
      - name: Install visual QA browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in {1..30}; do
            if curl -fsS --max-time 15 "${PAGE_URL}?build=${GITHUB_SHA}" >/dev/null; then
              echo "FSA_PAGES_REACHABLE=PASS"
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify Visual QA Experience route
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          QA_URL="${PAGE_URL%/}/qa/"
          EVIDENCE_URL="${PAGE_URL%/}/qa/evidence/10-five-reel-jackpot.jpg"
          for i in {1..30}; do
            BODY="$(curl -fsS --max-time 15 "${QA_URL}?build=${GITHUB_SHA}" || true)"
            if grep -q 'VISUAL QA EXPERIENCE' <<<"$BODY" \
              && grep -q '12/12 CERTIFIED' <<<"$BODY" \
              && curl -fsS --max-time 15 -o /dev/null "${EVIDENCE_URL}?build=${GITHUB_SHA}"; then
              echo "FSA_VISUAL_QA_ROUTE=PASS url=$QA_URL"
              exit 0
            fi
            sleep 2
          done
          echo "Visual QA Experience route did not become verifiable in time" >&2
          exit 1
      - name: Verify deployed runtime byte parity
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          ROOT="${PAGE_URL%/}"
          assets=(
            "index.html"
            "fsa-v9.js"
            "fsa-v8.css"
            "gameplay-layout-v9.css"
            "visual-fidelity-v10.css"
            "arcade-intensity-v12.css"
            "boss-spectacle-v13.css"
            "dense-mode-v14.css"
            "dense-mode-v14-overlay.css"
            "dense-graphics-v15.css"
            "arcade-intensity-v12.js"
            "boss-spectacle-v13.js"
            "dense-mode-v14.js"
            "dense-graphics-v15.js"
          )
          mkdir -p /tmp/fsa-live-parity
          for asset in "${assets[@]}"; do
            echo "Verifying deployed bytes: $asset"
            curl --retry 5 --retry-all-errors --retry-delay 2 -fsS --max-time 30 \
              -H 'Cache-Control: no-cache' \
              -o "/tmp/fsa-live-parity/$(basename "$asset")" \
              "$ROOT/$asset?build=$GITHUB_SHA"
            if ! cmp -s "$asset" "/tmp/fsa-live-parity/$(basename "$asset")"; then
              echo "LIVE BYTE MISMATCH: $asset" >&2
              echo "local=$(sha256sum "$asset" | awk '{print $1}')" >&2
              echo "live=$(sha256sum "/tmp/fsa-live-parity/$(basename "$asset")" | awk '{print $1}')" >&2
              exit 1
            fi
          done
          echo "FSA_LIVE_BYTE_PARITY=PASS commit=$GITHUB_SHA assets=${#assets[@]}"
      - name: Capture verified visual acceptance set
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          mkdir -p artifacts/visual-acceptance
          printf 'source=%s\ncommit=%s\ntransport=verified-local-render\n' "$PAGE_URL" "$GITHUB_SHA" > artifacts/visual-acceptance/transport.txt

          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/fsa-local-qa.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS --max-time 5 http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:4173/ >/dev/null

          if ! node tests/visual-acceptance-capture.mjs "http://127.0.0.1:4173/"; then
            echo "First deterministic browser capture failed; retrying once." >&2
            sleep 3
            if ! node tests/visual-acceptance-capture.mjs "http://127.0.0.1:4173/"; then
              python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          Path('artifacts/visual-acceptance/failure.json').write_text(json.dumps({
              'schema':'fsa.visual-acceptance.failure.v2',
              'sourceUrl':os.environ.get('PAGE_URL'),
              'sourceCommit':os.environ.get('GITHUB_SHA'),
              'generatedAt':datetime.now(timezone.utc).isoformat(),
              'message':'Live Pages bytes matched the deployed commit, but both deterministic local browser-render attempts failed.'
          },indent=2)+'\n')
          PY
              echo "--- local QA server diagnostics ---" >&2
              tail -n 200 /tmp/fsa-local-qa.log >&2 || true
              exit 1
            fi
          fi

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('artifacts/visual-acceptance/manifest.json')
          data=json.loads(path.read_text())
          source=os.environ['PAGE_URL'].rstrip('/')+'/'
          data['baseUrl']=source
          data['sourceUrl']=source
          data['sourceCommit']=os.environ.get('GITHUB_SHA')
          data['captureTransport']='local checkout browser render after byte-for-byte parity verification against deployed GitHub Pages runtime assets'
          data['liveByteParity']=True
          path.write_text(json.dumps(data,indent=2)+'\n')
          print('FSA_VISUAL_MANIFEST_SOURCE=PASS',source,data['sourceCommit'],'liveByteParity=1')
          PY
      - name: Upload live visual acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsa-live-visual-acceptance-${{ github.sha }}
          path: artifacts/visual-acceptance/
          if-no-files-found: error
          retention-days: 30
