name: F.S.A. Current Runtime Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "index.html"
      - "fsa-v8.css"
      - "gameplay-layout-v9.css"
      - "visual-fidelity-v10.css"
      - "arcade-intensity-v12.css"
      - "boss-spectacle-v13.css"
      - "fsa-v9.js"
      - "arcade-intensity-v12.js"
      - "boss-spectacle-v13.js"
      - "arcade-intensity-v12-bridge.js"
      - "assets/fsa-title-atlas-v10.svg"
      - "assets/fsa-slot-atlas-v10.svg"
      - "gameplay-selftest.js"
      - "guide.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "tests/runtime-behavior.mjs"
      - "tests/runtime-contract.mjs"
      - "tests/visual-fidelity-contract.mjs"
      - "tests/visual-acceptance-capture.mjs"
      - "tests/arcade-intensity-v12-contract.mjs"
      - "tests/boss-spectacle-v13-contract.mjs"
      - "tests/low-data-behavior.mjs"
      - "tests/low-data-budget.mjs"
      - ".github/workflows/pages.yml"
      - ".github/workflows/current-runtime-regression.yml"
      - ".github/workflows/validate-v9.yml"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "fsa-v8.css"
      - "gameplay-layout-v9.css"
      - "visual-fidelity-v10.css"
      - "arcade-intensity-v12.css"
      - "boss-spectacle-v13.css"
      - "fsa-v9.js"
      - "arcade-intensity-v12.js"
      - "boss-spectacle-v13.js"
      - "arcade-intensity-v12-bridge.js"
      - "assets/fsa-title-atlas-v10.svg"
      - "assets/fsa-slot-atlas-v10.svg"
      - "gameplay-selftest.js"
      - "guide.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "tests/runtime-behavior.mjs"
      - "tests/runtime-contract.mjs"
      - "tests/visual-fidelity-contract.mjs"
      - "tests/visual-acceptance-capture.mjs"
      - "tests/arcade-intensity-v12-contract.mjs"
      - "tests/boss-spectacle-v13-contract.mjs"
      - "tests/low-data-behavior.mjs"
      - "tests/low-data-budget.mjs"
      - ".github/workflows/pages.yml"
      - ".github/workflows/current-runtime-regression.yml"
      - ".github/workflows/validate-v9.yml"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  current-runtime-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax gates
        run: |
          node --check fsa-v9.js
          node --check arcade-intensity-v12.js
          node --check boss-spectacle-v13.js
          node --check arcade-intensity-v12-bridge.js
          node --check gameplay-selftest.js
          node --check sw.js
          node --check tests/runtime-behavior.mjs
          node --check tests/runtime-contract.mjs
          node --check tests/visual-fidelity-contract.mjs
          node --check tests/visual-acceptance-capture.mjs
          node --check tests/arcade-intensity-v12-contract.mjs
          node --check tests/boss-spectacle-v13-contract.mjs
      - name: Current gameplay contract
        run: node gameplay-selftest.js
      - name: Executable current runtime behavior
        run: node tests/runtime-behavior.mjs
      - name: DOM PWA mobile and safety contract
        run: node tests/runtime-contract.mjs
      - name: Visual fidelity v10 contract
        run: node tests/visual-fidelity-contract.mjs
      - name: Arcade intensity v12 contract
        run: node tests/arcade-intensity-v12-contract.mjs
      - name: Boss spectacle v13 contract
        run: node tests/boss-spectacle-v13-contract.mjs
      - name: Low-data and 2G behavior
        run: |
          node tests/low-data-budget.mjs
          node tests/low-data-behavior.mjs
      - name: Completion marker
        run: echo 'FSA_CURRENT_RUNTIME_REGRESSION=PASS'