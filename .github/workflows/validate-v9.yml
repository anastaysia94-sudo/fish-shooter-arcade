name: Validate F.S.A. v9 Gameplay

on:
  push:
    branches: [main, closure-started-scope-20260908, fsa-production-backend-v1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate v9 gameplay and Founder backend contract
        shell: bash
        run: |
          set -euo pipefail
          test -f fsa-v9.js
          test -f gameplay-layout-v9.css
          test -f gameplay-selftest.js
          test -f admin/logic-selftest.js
          test -f backend/supabase/migrations/20260908_fsa_founder_console_backend_v1.sql
          test -f backend/supabase/functions/fsa-founder-admin/index.ts
          grep -q 'fsa-v9.js' index.html
          grep -q 'gameplay-layout-v9.css' index.html
          node --check fsa-v9.js
          node --check gameplay-selftest.js
          node --input-type=module --check < admin/app.js
          node --check admin/logic-selftest.js
          node --check sw.js
          node gameplay-selftest.js
          node admin/logic-selftest.js
          echo 'FSA_V9_AND_FOUNDER_BACKEND=PASS'
