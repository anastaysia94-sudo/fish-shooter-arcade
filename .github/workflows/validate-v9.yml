name: Validate F.S.A. v9 Gameplay

on:
  push:
    branches: [main, fsa-distributor-hierarchy-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate v9 gameplay and production hierarchy
        shell: bash
        run: |
          set -euo pipefail
          test -f fsa-v9.js
          test -f gameplay-layout-v9.css
          test -f gameplay-selftest.js
          test -f tests/runtime-behavior.mjs
          test -f tests/runtime-contract.mjs
          test -f tests/low-data-budget.mjs
          test -f tests/low-data-behavior.mjs
          test -f admin/logic-selftest.js
          test -f backend/supabase/migrations/20260909_fsa_distributor_hierarchy_schema_v2.sql
          test -f backend/supabase/migrations/20260909_fsa_distributor_hierarchy_authority_v2.sql
          test -f backend/supabase/functions/fsa-founder-admin/index.ts
          grep -q 'fsa-v9.js' index.html
          grep -q 'gameplay-layout-v9.css' index.html
          grep -q 'Founder → Distributor → Agent → User' admin/index.html
          node --check fsa-v9.js
          node --check gameplay-selftest.js
          node --check tests/runtime-behavior.mjs
          node --check tests/runtime-contract.mjs
          node --check tests/low-data-budget.mjs
          node --check tests/low-data-behavior.mjs
          node --input-type=module --check < admin/app.js
          node --check admin/logic-selftest.js
          node --check sw.js
          node gameplay-selftest.js
          node tests/runtime-behavior.mjs
          node tests/runtime-contract.mjs
          node tests/low-data-budget.mjs
          node tests/low-data-behavior.mjs
          node admin/logic-selftest.js
          echo 'FSA_V9_CURRENT_RUNTIME_AND_HIERARCHY_V2=PASS'
