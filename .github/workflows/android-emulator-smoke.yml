name: F.S.A. Android v12 Emulator Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "android-fsa/**"
      - ".github/workflows/android-emulator-smoke.yml"
  push:
    branches: [main]
    paths:
      - "android-fsa/**"
      - ".github/workflows/android-emulator-smoke.yml"

permissions:
  contents: read

jobs:
  android-emulator-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable debug APK
        working-directory: android-fsa
        run: gradle :app:assembleDebug --stacktrace

      - name: Enable KVM for the Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and certify F.S.A. in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android-fsa/emulator-smoke.sh

      - name: Upload Android emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FSA-Android-v12-emulator-evidence
          path: artifacts/android-emulator/
          if-no-files-found: warn
          retention-days: 30
