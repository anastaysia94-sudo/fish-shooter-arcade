name: F.S.A. Lobby Fidelity v13

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lobby-fidelity-v13.css"
      - "cloud-sync-v11.css"
      - "arcade-intensity-v12-bridge.js"
      - "sw.js"
      - "tests/lobby-fidelity-v13-contract.mjs"
      - "tests/visual-acceptance-capture.mjs"
      - ".github/workflows/lobby-fidelity-v13.yml"
  push:
    branches: [main]
    paths:
      - "lobby-fidelity-v13.css"
      - "cloud-sync-v11.css"
      - "arcade-intensity-v12-bridge.js"
      - "sw.js"
      - "tests/lobby-fidelity-v13-contract.mjs"
      - "tests/visual-acceptance-capture.mjs"
      - ".github/workflows/lobby-fidelity-v13.yml"

permissions:
  contents: read

jobs:
  lobby-fidelity-v13:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax check visual contracts
        run: |
          node --check tests/lobby-fidelity-v13-contract.mjs
          node --check tests/visual-acceptance-capture.mjs
      - name: Premium lobby and Lite/2G contract
        run: node tests/lobby-fidelity-v13-contract.mjs
      - name: Preserve current runtime contracts
        run: |
          node tests/runtime-contract.mjs
          node tests/visual-fidelity-contract.mjs
          node tests/arcade-intensity-v12-contract.mjs
      - name: Preserve low-data and 2G contracts
        run: |
          node tests/low-data-budget.mjs
          node tests/low-data-behavior.mjs
      - name: Completion marker
        run: echo 'FSA_LOBBY_FIDELITY_V13_GATE=PASS'
