name: Build F.S.A. Android Release v12

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-fsa/**"
      - "tests/android-release-contract.mjs"
      - ".github/workflows/build-fsa-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-fsa/**"
      - "tests/android-release-contract.mjs"
      - ".github/workflows/build-fsa-android.yml"

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Android v12 source and security contract
        run: node tests/android-release-contract.mjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Lint, test, build APK and release bundle
        working-directory: android-fsa
        run: gradle :app:lintRelease :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease --stacktrace
      - name: Verify Android artifacts
        shell: bash
        run: |
          test -f android-fsa/app/build/outputs/apk/debug/app-debug.apk
          test -f android-fsa/app/build/outputs/bundle/release/app-release.aab
          sha256sum \
            android-fsa/app/build/outputs/apk/debug/app-debug.apk \
            android-fsa/app/build/outputs/bundle/release/app-release.aab \
            > android-fsa/SHA256SUMS.txt
          cat android-fsa/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FSA-Android-v12-release-candidate
          path: |
            android-fsa/app/build/outputs/apk/debug/app-debug.apk
            android-fsa/app/build/outputs/bundle/release/app-release.aab
            android-fsa/SHA256SUMS.txt
            android-fsa/app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 30
