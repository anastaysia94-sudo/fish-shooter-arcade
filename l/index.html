<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b0922"><title>SmartPickShop Short Links</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#fff;background:#0b0922}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 5%,#523093 0,transparent 32%),#0b0922}main{max-width:760px;margin:auto;padding:32px 20px 60px}.brand{font-weight:850}.brand span{color:#55f3e5}h1{font-size:clamp(2rem,6vw,3.6rem);letter-spacing:-.055em;margin:12px 0}.muted{color:#b8b2d4;line-height:1.55}.card{background:#171333;border:1px solid #4b436e;border-radius:16px;padding:14px;margin:10px 0;display:grid;grid-template-columns:160px 1fr auto;gap:10px;align-items:center}.card a{color:#9ff9ed;word-break:break-all}.card button{border:0;border-radius:9px;padding:10px 12px;background:#64f4df;color:#071d21;font-weight:800;cursor:pointer}.owner{border-color:#775179}.note{font-size:.82rem;color:#918ba9;margin-top:20px}@media(max-width:650px){.card{grid-template-columns:1fr}.card button{width:100%}}</style></head><body><main><div class="brand">SmartPickShop <span>Holdings</span></div><h1>Short Links</h1><p class="muted">Permanent clean links for Traffic Strategy V2. Campaign links silently redirect to the full UTM-tagged picker.</p><div id="links"></div><p class="note">The console link is owner-only. Do not share your owner access key.</p></main><script>const host='https://anastaysia94-sudo.github.io/fish-shooter-arcade';const links=[['Public picker','/p/'],['Owner console','/c/'],['Facebook','/f/'],['Instagram','/i/'],['TikTok','/t/'],['Telegram','/g/'],['WhatsApp','/w/'],['Solo Founders','/s/'],['Fusion42','/42/'],['SupaHunt','/u/'],['Product Hunt','/ph/'],['Hacker News','/h/']];document.getElementById('links').innerHTML=links.map((x,i)=>{const u=host+x[1];return '<div class="card '+(i===1?'owner':'')+'"><b>'+x[0]+'</b><a href="'+u+'" target="_blank" rel="noopener">'+u+'</a><button data-u="'+u+'">Copy</button></div>'}).join('');document.querySelectorAll('button[data-u]').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(b.dataset.u);const old=b.textContent;b.textContent='Copied';setTimeout(()=>b.textContent=old,900)});</script></body></html>
